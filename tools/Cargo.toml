[package]
name = "day-selfupdate-tools"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
publish = false

[dependencies]
day-selfupdate-core = { path = "../crates/update-core" }
serde_json = "1"
libc = "0.2"
zip = { version = "4.6", default-features = false, features = ["deflate"] }

