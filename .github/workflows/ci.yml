name: ci
on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - if: runner.os == 'Windows'
        run: choco install nsis -y --no-progress
      - if: runner.os != 'macOS'
        run: python scripts/desktop_fixture.py
  update-e2e:
    name: Packaged update (${{ matrix.target }})
    needs: host
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: macos-appkit
            xcode: '26.3'
          - os: windows-latest
            target: windows-winui
          - os: ubuntu-latest
            target: linux-gtk
    runs-on: ${{ matrix.os }}
    # No release environment or secrets: each run generates a disposable Ed25519 key.
    steps:
      - uses: actions/checkout@v7
      - name: Select the macOS build toolchain
        if: runner.os == 'macOS'
        shell: bash
        env:
          XCODE_VERSION: ${{ matrix.xcode }}
        run: |
          set -euo pipefail
          # macos-15 defaults to Xcode 16.4 / SDK 15.5. Keep testing the older
          # OS, but explicitly select the newer toolchain installed on this image.
          export DEVELOPER_DIR="/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          test -d "$DEVELOPER_DIR"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          mkdir -p build/e2e/macos-appkit
          {
            xcodebuild -version
            xcrun --sdk macosx --show-sdk-version
            xcrun clang --version
          } 2>&1 | tee build/e2e/macos-appkit/toolchain.log
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: daybrite/actions/.github/actions/setup-day-deps@v1
        with:
          target: ${{ matrix.target }}
          pack: 'true'
          extras: 'true'
      - uses: daybrite/actions/.github/actions/setup-day-cli@v1
        id: day-cli
      - uses: actions/cache@v4
        with:
          key: update-e2e-${{ runner.os }}-${{ runner.arch }}-${{ matrix.xcode || 'default' }}-${{ steps.day-cli.outputs.commit }}-${{ hashFiles('**/Cargo.toml') }}
          path: |
            build/e2e/${{ matrix.target }}/workspace/target
            build/e2e/${{ matrix.target }}/workspace/demo/build/day/cargo
      - name: Build 1.0 and 1.1; reject tampering; install and relaunch
        shell: bash
        env:
          GSK_RENDERER: cairo
          LIBGL_ALWAYS_SOFTWARE: '1'
          DAY_VERBOSE: '1'
          TEST_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p "build/e2e/$TEST_TARGET"
          # Keep this outside reports/: the harness recreates that directory.
          # Verbose output retains ld's diagnostic, which Day's short Xcode
          # summary can reduce to just "linker command failed".
          {
            if [ "$RUNNER_OS" = Linux ]; then
              export XDG_RUNTIME_DIR="$RUNNER_TEMP/selfupdate-runtime"
              mkdir -p "$XDG_RUNTIME_DIR"
              chmod 700 "$XDG_RUNTIME_DIR"
              dbus-run-session -- xvfb-run -a python scripts/e2e.py
            else
              python scripts/e2e.py
            fi
          } 2>&1 | tee "build/e2e/$TEST_TARGET/build.log"
      - name: Preserve update evidence (no private keys)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: update-e2e-${{ matrix.target }}
          path: |
            build/e2e/${{ matrix.target }}/reports/
            build/e2e/${{ matrix.target }}/build.log
            build/e2e/${{ matrix.target }}/toolchain.log
          if-no-files-found: warn
  demo:
    needs: [host, update-e2e]
    uses: daybrite/actions/.github/workflows/dayapp.yml@v1
    permissions:
      contents: write
    secrets: inherit
    with:
      project-path: demo
      targets: macos-appkit, windows-winui, linux-gtk
      update-day-deps: true
      scripts: dayscript/demo.yaml
      target-setup: |
        macos-appkit: DAY_UPDATE_PUBLIC_KEY='${{ vars.DAY_UPDATE_PUBLIC_KEY }}' DAY_UPDATE_APPLE_TEAM='${{ vars.DAY_UPDATE_APPLE_TEAM }}' python3 scripts/release.py configure macos-appkit
        windows-winui: DAY_UPDATE_PUBLIC_KEY='${{ vars.DAY_UPDATE_PUBLIC_KEY }}' python scripts/release.py configure windows-winui
        linux-gtk: DAY_UPDATE_PUBLIC_KEY='${{ vars.DAY_UPDATE_PUBLIC_KEY }}' python3 scripts/release.py configure linux-gtk
      post-pack-command: DAY_UPDATE_APPLE_TEAM='${{ vars.DAY_UPDATE_APPLE_TEAM }}' python ../scripts/release.py stage "$DAY_PACK_TARGET"
      signing-environment: release-signing
      macos-update-zip: selfupdate-demo-macos-appkit-update.zip
      update-signing: true
      update-public-key: ${{ vars.DAY_UPDATE_PUBLIC_KEY }}
      update-application-id: dev.daybrite.selfupdatedemo
      upload-ios: 'false'
      upload-macos: 'false'
      upload-play: 'false'
