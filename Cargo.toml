[package]
name = "day-piece-self-update"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
description = "Experimental Day self-update piece and macOS installer prototype"
repository = "https://github.com/daybrite/day-piece-selfupdate"
build = "build.rs"

[workspace]
members = ["crates/update-core", "tools"]
resolver = "3"

[features]
default = ["github"]
github = ["dep:ureq"]
ui = ["dep:day-core", "dep:day-pieces", "dep:day-reactive"]
# The Updates settings group and its scheduler (src/settings.rs): a day-piece-settings provider.
settings = [
    "ui",
    "dep:day-piece-settings",
    "dep:day-localization-ui",
    "dep:day-spec",
    "dep:day-build",
    "dep:log",
]
appkit = ["ui", "day-piece-settings?/appkit"]
mock = ["ui", "day-piece-settings?/mock"]
gtk = ["ui", "day-piece-settings?/gtk"]
winui = ["ui", "day-piece-settings?/winui"]

[package.metadata.day]
compat = "0.6"

[package.metadata.day.piece]
backends = ["appkit", "gtk", "winui", "mock"]

[dependencies]
day-self-update-core = { path = "crates/update-core", version = "0.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Canonical dependencies; use scripts/local-day.py for adjacent-checkout development.
day-core = { version = "0.6", optional = true }
day-pieces = { version = "0.6", optional = true }
day-reactive = { version = "0.6", optional = true }
day-piece-settings = { version = "0.6", optional = true }
day-localization-ui = { version = "0.6", optional = true }
day-spec = { version = "0.6", optional = true }
log = { version = "0.4", optional = true }

[build-dependencies]
cc = "1"
day-build = { version = "0.6", optional = true }

[dependencies.ureq]
version = "3.4"
optional = true

[dependencies.tempfile]
version = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_Packaging_Appx"] }
