[package]
name = "day-piece-self-update"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
description = "Experimental Day self-update piece and macOS installer prototype"
repository = "https://github.com/daybrite/day-piece-selfupdate"
build = "build.rs"

[workspace]
members = ["crates/update-core", "tools"]
resolver = "3"

[features]
default = ["github"]
github = ["dep:ureq"]
ui = ["dep:day-core", "dep:day-pieces", "dep:day-reactive"]
# The Updates settings group and its scheduler (src/settings.rs): a day-piece-settings provider.
settings = [
    "ui",
    "dep:day-piece-settings",
    "dep:day-localization-ui",
    "dep:day-spec",
    "dep:day-build",
    "dep:log",
]
appkit = ["ui", "day-piece-settings?/appkit"]
mock = ["ui", "day-piece-settings?/mock"]
gtk = ["ui", "day-piece-settings?/gtk"]
winui = ["ui", "day-piece-settings?/winui"]

[package.metadata.day]
compat = "0.*"

[package.metadata.day.piece]
backends = ["appkit", "gtk", "winui", "mock"]

[dependencies]
day-self-update-core = { path = "crates/update-core", version = "0.*" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Canonical dependencies; use scripts/local-day.py for adjacent-checkout development.
day-core = { version = "0.*", optional = true }
day-pieces = { version = "0.*", optional = true }
day-reactive = { version = "0.*", optional = true }
day-piece-settings = { version = "0.*", optional = true }
day-localization-ui = { version = "0.*", optional = true }
day-spec = { version = "0.*", optional = true }
log = { version = "0.4", optional = true }

[build-dependencies]
cc = "1"
day-build = { version = "0.*", optional = true }

[dependencies.ureq]
version = "3.4"
optional = true

[dependencies.tempfile]
version = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_Packaging_Appx"] }

[lints]
workspace = true

# Lint policy: Clippy's `pedantic` group, and CI treats every warning as an error. This table
# matches the one in `day`.
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Day converts between float layout units and the integer pixel, index and FFI types of eight
# native toolkits. `as` is the only operator for float-to-integer, and these four lints cannot
# tell that from a narrowing integer cast, so they would need an exception at nearly every site.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# Function length and short or similar names are style limits this codebase does not follow:
# geometry is written in `x`/`y`/`w`/`h`, and a backend's realize and patch arms stay in one place.
many_single_char_names = "allow"
similar_names = "allow"
too_many_lines = "allow"
# A backend module imports the whole spec vocabulary, and which names it uses differs with the
# backend feature and target, so an explicit list is unused or incomplete under some of them.
wildcard_imports = "allow"
# Option structs and backend calls mirror native toolkit flags, which are booleans.
fn_params_excessive_bools = "allow"
struct_excessive_bools = "allow"
# Asks for `#[must_use]` on nearly every function that returns a value, including ones called
# for their effect. Builders are still covered by `return_self_not_must_use`.
must_use_candidate = "allow"
