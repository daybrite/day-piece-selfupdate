[package]
name = "day-selfupdate-core"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
publish = false

[dependencies]
ed25519-dalek = "2.2"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Storage_FileSystem"] }
