[package]
name = "selfupdate-demo"
version = "0.1.0"
edition = "2024"
build = "build.rs"
publish = false

[features]
# Only the isolated CI copies enable the automated GUI driver.
e2e = []
default = ["mock"]
mock = ["day/mock", "day-piece-self-update/mock", "day-piece-settings/mock"]
appkit = ["day/appkit", "day-piece-self-update/appkit", "day-piece-settings/appkit"]
gtk = ["day/gtk", "day-piece-self-update/gtk", "day-piece-settings/gtk"]
winui = ["day/winui", "day-piece-self-update/winui", "day-piece-settings/winui"]

[lib]
name = "dayapp"
crate-type = ["rlib"]

[dependencies]
day = { git = "https://github.com/daybrite/day" }
day-piece-settings = { git = "https://github.com/daybrite/day" }
# `settings` contributes the Updates group and the Check for Updates… command to Preferences.
day-piece-self-update = { path = "..", features = ["settings"] }
serde_json = "1"

[build-dependencies]
day-build = { git = "https://github.com/daybrite/day" }

[workspace]
