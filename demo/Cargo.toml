[package]
name = "selfupdate-demo"
version = "0.1.0"
edition = "2024"
build = "build.rs"
publish = false

[features]
# Only the isolated CI copies enable the automated GUI driver.
e2e = []
default = ["mock"]
mock = ["day/mock", "day-piece-selfupdate/mock"]
appkit = ["day/appkit", "day-piece-selfupdate/appkit"]
gtk = ["day/gtk", "day-piece-selfupdate/gtk"]
winui = ["day/winui", "day-piece-selfupdate/winui"]

[lib]
name = "dayapp"
crate-type = ["rlib"]

[dependencies]
day = { git = "https://github.com/daybrite/day" }
day-piece-selfupdate = { path = "..", features = ["ui"] }
serde_json = "1"

[build-dependencies]
day-build = { git = "https://github.com/daybrite/day" }

[workspace]
